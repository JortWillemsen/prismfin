name: Verify Release Version

on:
  workflow_call:
    inputs:
      release-tag:
        description: 'GitHub release tag in vx.x.x format'
        required: false
        type: string
        default: ''

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify package.json and CLIENT_VERSION
        env:
          RAW_TAG: ${{ inputs.release-tag }}
          CONFIG_PATH: src/common/constants/config.ts
        run: |
          # 1. Read package.json version
          PKG_VERSION=$(jq -r '.version' package.json)

          # 2. Read CLIENT_VERSION from config
          CONFIG_VERSION=$(sed -nE 's/^[[:space:]]*export const CLIENT_VERSION[[:space:]]*=[[:space:]]*["'\'']([^"'\'']+)["'\''].*/\1/p' "$CONFIG_PATH")
          CONFIG_LINE=$(grep -n "export const CLIENT_VERSION" "$CONFIG_PATH" | cut -d: -f1 || echo "1")

          # 3. Determine expected version (strip leading 'v' from vx.x.x, or fallback to package.json on PRs)
          if [ -n "$RAW_TAG" ]; then
            EXPECTED="${RAW_TAG#v}"
          else
            EXPECTED="$PKG_VERSION"
          fi

          echo "Release Tag:    ${RAW_TAG:-N/A (PR Sync Check)}"
          echo "Expected:       $EXPECTED"
          echo "package.json:   $PKG_VERSION"
          echo "CLIENT_VERSION: $CONFIG_VERSION"

          FAILED=0

          # Enforce strict vx.x.x format when release-tag is provided
          if [ -n "$RAW_TAG" ] && [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid Tag Format::Release tag '$RAW_TAG' does not match required format vx.x.x"
            FAILED=1
          fi

          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "::error file=package.json,title=Version Mismatch::package.json ($PKG_VERSION) does not match expected version ($EXPECTED)"
            FAILED=1
          fi

          if [ "$CONFIG_VERSION" != "$EXPECTED" ]; then
            echo "::error file=$CONFIG_PATH,line=$CONFIG_LINE,title=Version Mismatch::CLIENT_VERSION ($CONFIG_VERSION) does not match expected version ($EXPECTED)"
            FAILED=1
          fi

          {
            echo "### Version Verification"
            echo "| Source | Value | Status |"
            echo "| :--- | :--- | :--- |"
            [ -n "$RAW_TAG" ] && echo "| **Release Tag** | \`$RAW_TAG\` | Expected: \`$EXPECTED\` |"
            echo "| \`package.json\` | \`$PKG_VERSION\` | $([ "$PKG_VERSION" = "$EXPECTED" ] && echo "Match" || echo "Mismatch") |"
            echo "| \`CLIENT_VERSION\` | \`$CONFIG_VERSION\` | $([ "$CONFIG_VERSION" = "$EXPECTED" ] && echo "Match" || echo "Mismatch") |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $FAILED