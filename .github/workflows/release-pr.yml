name: Release Pull Request Verification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, edited, reopened]

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse version from PR title
        id: parse
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"

          # Search for vX.X.X or X.X.X anywhere in the PR title
          if [[ "$PR_TITLE" =~ v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="v${BASH_REMATCH[1]}"
            echo "Extracted version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "::error title=Version Missing in PR Title::Could not find a valid version pattern (e.g. v0.7.1 or 0.7.1) in the PR title: '$PR_TITLE'"
            exit 1
          fi

  verify-version-code:
    needs: extract-version
    uses: ./.github/workflows/release-version-verification.yml
    with:
      release-tag: ${{ needs.extract-version.outputs.version }}