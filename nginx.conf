map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Runtime configuration and HTML - do not cache so env changes apply immediately
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files $uri =404;
    }

    # Web app manifest - do not cache so dynamic PWA branding updates immediately
    location ~* ^/(manifest\.webmanifest|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
    }

    # Static assets with content hash - cache long-term
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 1. Forward SSO Start and Auth JSON endpoints directly to Jellyfin
    location ~ ^/sso/OID/(start|Auth)/([a-zA-Z0-9_-]+)/?$ {
        proxy_pass __JELLYFIN_SERVER_URL__;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # 2. Internal alias used by the SPA's fetch() to validate the OIDC code
    # Rewrites /api/sso-validate/{provider}?code=... -> /sso/OID/redirect/{provider}?code=...
    location ~ ^/api/sso-validate/([a-zA-Z0-9_-]+)$ {
        rewrite ^/api/sso-validate/([a-zA-Z0-9_-]+)$ /sso/OID/redirect/$1 break;
        proxy_pass __JELLYFIN_SERVER_URL__;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # The browser cannot call an HTTP Jellyfin server from this HTTPS app.
    location /jellyfin-proxy/ {
        rewrite ^/jellyfin-proxy(/.*)$ $1 break;
        proxy_pass __JELLYFIN_SERVER_URL__;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Fallback to index.html for Single Page Application (including /sso/OID/redirect/*)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
